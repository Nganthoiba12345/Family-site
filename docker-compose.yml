services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: family_heritage_app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/data/family.db
      - REDIS_URL=redis://redis:6379
      - PAYLOAD_SECRET=${PAYLOAD_SECRET:-family-heritage-secret-key-change-in-production-12345}
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Host bind mounts for permanent persistence
      - ./data:/app/data
      - ./media:/app/media
      - ./uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: family_heritage_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
