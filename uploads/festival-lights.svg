<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)" rx="40" />
  <circle cx="600" cy="350" r="400" fill="url(#glow)" />
  
  <!-- Decorative Frame -->
  <rect x="40" y="40" width="1120" height="720" rx="30" fill="none" stroke="#D97706" stroke-width="2" stroke-opacity="0.5" />
  
