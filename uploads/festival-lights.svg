    <path d="M -90 60 L -30 0 L 30 50 L 70 20 L 90 60" />
  </g>

  <!-- Title -->
  <text x="600" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="bold" fill="#0F172A" text-anchor="middle">Annual Festival Celebration</text>
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="500" fill="#2563EB" text-anchor="middle">Winter 2005 • Gathering of All Branches</text>
  <text x="600" y="630" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#64748B" text-anchor="middle">Family Heritage Collection</text>
